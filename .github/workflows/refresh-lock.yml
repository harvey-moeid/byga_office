name: Refresh dependency lock

on:
  push:
    branches:
      - fix/production-hardening-20261006
    paths:
      - "package.json"
      - ".github/workflows/refresh-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Refresh frozen dependency graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched audit
        run: npm run security:audit
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh patched dependency lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
