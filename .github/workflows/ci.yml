name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Code, tests and Worker build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm run security:audit
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit and Worker integration tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Worker deployment dry run
        run: npm run deploy:check
      - name: Upload frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Desktop and mobile browser tests
    runs-on: ubuntu-24.04
    # Playwright itself finishes in ~5 minutes, but Ubuntu mirror downloads for
    # system browser dependencies can occasionally take >10 minutes. Keep the
    # browser job bounded while avoiding false-red PRs after all tests pass.
    timeout-minutes: 30
    env:
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        # Software WebGL and trace capture share the runner CPU; serialize graphics acceptance.
        run: npm run test:browser -- --workers=1 --reporter=line,html --trace=retain-on-failure
      - name: Browser to Worker and D1 integration
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-api-report
        run: npm run test:browser:integration -- --reporter=line,html --trace=retain-on-failure
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            playwright-api-report/
            browser-api-results/
          if-no-files-found: ignore
          retention-days: 7
